# PostgreSQL configuration for Nitro Enclave
# Optimized for limited memory and ephemeral storage

# Connection settings
listen_addresses = 'localhost'
port = 5432
max_connections = 50

# Memory settings (conservative for enclave)
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL settings
wal_level = minimal
max_wal_senders = 0
fsync = on
synchronous_commit = on

# Checkpoints
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error

# Locale
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# Data directory
data_directory = '/var/lib/postgresql/15/main'
hba_file = '/etc/lightfriend/config/pg_hba.conf'
ident_file = '/etc/lightfriend/config/pg_ident.conf'

# Unix socket
unix_socket_directories = '/run/postgresql'
